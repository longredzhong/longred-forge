[workspace]
name = "longred-forge"
version = "0.1.0"
description = "Longred personal conda package repository"
authors = ["Longred <longredzhong@outlook.com>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tasks]
build = "python scripts/build.py"
update = "python scripts/update.py"
test = "python -m unittest discover -s tests -v"
validate = "python scripts/validate.py"
lint = "ruff check scripts tests recipes --select E9,F63,F7,F82 && actionlint -shellcheck="

[dependencies]
ruff = ">=0.14,<0.15"
rattler-build = ">=0.54.0,<0.55"
python = ">=3.14.2,<3.15"
actionlint = ">=1.7.12,<2"

[pypi-dependencies]
httpx = ">=0.28.1, <0.29"
PyYAML = ">=6.0, <7.0"
