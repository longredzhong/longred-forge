# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 0.25.3
package:
  name: sofka
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/nklmilojevic/sofka/releases/download/v${{ version }}/sofka-v${{
      version }}-x86_64-unknown-linux-gnu.tar.gz
    sha256: 9aa1ae0f49d620b33a59a2d195de517c97a10ee3baa9976ba8dfcb1078a7857c
- if: linux and aarch64
  then:
  - url: https://github.com/nklmilojevic/sofka/releases/download/v${{ version }}/sofka-v${{
      version }}-aarch64-unknown-linux-gnu.tar.gz
    sha256: 7381fbf92a90f8d24886323803b1b16435bd71e380d1559a1f5c594921dc453d
- if: osx and x86_64
  then:
  - url: https://github.com/nklmilojevic/sofka/releases/download/v${{ version }}/sofka-v${{
      version }}-x86_64-apple-darwin.tar.gz
    sha256: 941de57c6f7054f7ea4b7d1843760e8ac64002dc574f5938da16816e9ee69c23
- if: osx and arm64
  then:
  - url: https://github.com/nklmilojevic/sofka/releases/download/v${{ version }}/sofka-v${{
      version }}-aarch64-apple-darwin.tar.gz
    sha256: b6b0fc76318fb8ce7d48c25500f5d3352a71e4d8a5cfc5a0183c7bd4a28943aa
build:
  number: 0
  skip: win
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script: python -c "import os, shutil, stat, sys; prefix = os.environ.get('PREFIX');
    [exit(1) if not prefix else None]; bin_dir = os.path.join(prefix, 'bin'); binary_name
    = 'sofka'; os.makedirs(bin_dir, exist_ok=True); source_patterns = [binary_name,
    f'./{binary_name}', os.path.join('.', binary_name)]; source_file = next((p for
    p in source_patterns if os.path.isfile(p)), None); [exit(1) if not source_file
    else None]; dest_file = os.path.join(bin_dir, binary_name); shutil.copy2(source_file,
    dest_file); os.chmod(dest_file, os.stat(dest_file).st_mode | stat.S_IEXEC | stat.S_IXUSR
    | stat.S_IXGRP | stat.S_IXOTH)"
requirements:
  build: null
  run: null
tests:
- script:
  - sofka --version
about:
  homepage: https://sofka.rs
  repository: https://github.com/nklmilojevic/sofka
  documentation: https://sofka.rs
  license: Apache-2.0
  summary: A Kubernetes TUI, reimagined in Rust - built on kube-rs and ratatui, async-first
    from the ground up
  description: 'sofka is a terminal UI for Kubernetes, reimagined in Rust. Built on
    kube-rs and ratatui, async-first from the ground up.

    '
extra:
  recipe-maintainers:
  - longredzhong
