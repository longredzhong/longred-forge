# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 18.14.2
package:
  name: oh-my-pi
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/can1357/oh-my-pi/releases/download/v${{ version }}/omp-linux-x64
    sha256: cde0bc4ac8ec333c4880039a5242ff33dbfc6544747d67aeb99bb077874aeec1
- if: linux and aarch64
  then:
  - url: https://github.com/can1357/oh-my-pi/releases/download/v${{ version }}/omp-linux-arm64
    sha256: afbdf04be3ddbe34a07e91c913ddb6d335a3a0210f520ac5a197a245888ad63e
- if: osx and x86_64
  then:
  - url: https://github.com/can1357/oh-my-pi/releases/download/v${{ version }}/omp-darwin-x64
    sha256: 62835e51acc0f07d19493da736b7215d3224fd5099754b7e42c3b0fdc2eb7f45
- if: osx and arm64
  then:
  - url: https://github.com/can1357/oh-my-pi/releases/download/v${{ version }}/omp-darwin-arm64
    sha256: 9b7bda0bd8ec8d1fd8f8deda076180deef2d4921ee60e7d2f39044ee7d9437ee
- if: win and x86_64
  then:
  - url: https://github.com/can1357/oh-my-pi/releases/download/v${{ version }}/omp-windows-x64.exe
    sha256: aa04e4ff3b2d97d604839edf1bcf5a0085818389d9fc8c1a18875ee7b5e3b0f8
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
tests:
- script:
  - omp --version
about:
  homepage: https://github.com/can1357/oh-my-pi
  repository: https://github.com/can1357/oh-my-pi
  license: MIT
  summary: Oh My Pi coding agent, installed as omp
extra:
  recipe-maintainers:
  - longredzhong
