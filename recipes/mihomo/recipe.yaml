# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 1.19.31
package:
  name: mihomo
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/MetaCubeX/mihomo/releases/download/v${{ version }}/mihomo-linux-amd64-compatible-v${{
      version }}.gz
    sha256: 04cf9f09671704f839ddbee2e93069dc831a4123a75281e725d1d96ab9ac1afc
    file_name: mihomo.gz
- if: linux and aarch64
  then:
  - url: https://github.com/MetaCubeX/mihomo/releases/download/v${{ version }}/mihomo-linux-arm64-v${{
      version }}.gz
    sha256: 9e0f11afbf38426b8bd88fdc594678f8161c57eccb4e1b77acb12b493904f1d4
    file_name: mihomo.gz
- if: osx and x86_64
  then:
  - url: https://github.com/MetaCubeX/mihomo/releases/download/v${{ version }}/mihomo-darwin-amd64-compatible-v${{
      version }}.gz
    sha256: fb6fca0e105b4310a21eaacd3a8d3853d3d8b87fa4c69737bea52a30a435aac7
    file_name: mihomo.gz
- if: osx and arm64
  then:
  - url: https://github.com/MetaCubeX/mihomo/releases/download/v${{ version }}/mihomo-darwin-arm64-v${{
      version }}.gz
    sha256: d131f44b3deb2a8356f7ac75048ad67a10d53243323951c4f3cda7b672922963
    file_name: mihomo.gz
- if: win and x86_64
  then:
  - url: https://github.com/MetaCubeX/mihomo/releases/download/v${{ version }}/mihomo-windows-amd64-compatible-v${{
      version }}.zip
    sha256: 93d14e9a13b49b2f2d256202d02cc8d14a7c4695edf084cae0f941986bc9c218
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script: python -c "import glob, gzip, os, shutil, sys; prefix = os.environ['PREFIX'];
    is_unix = not sys.platform.startswith('win'); bin_dir = os.path.join(prefix, 'bin'
    if is_unix else 'Scripts'); os.makedirs(bin_dir, exist_ok=True); dest = os.path.join(bin_dir,
    'mihomo' if is_unix else 'mihomo.exe'); src = None if is_unix else glob.glob('**/*.exe',
    recursive=True)[0]; open(dest, 'wb').write(gzip.decompress(open('mihomo.gz', 'rb').read()))
    if is_unix else shutil.copy2(src, dest); os.chmod(dest, os.stat(dest).st_mode
    | 0o755) if is_unix else None"
requirements:
  build: null
  run: null
tests:
- script:
  - mihomo -v
about:
  homepage: https://github.com/MetaCubeX/mihomo
  repository: https://github.com/MetaCubeX/mihomo
  documentation: https://wiki.metacubex.one
  license: GPL-3.0-only
  summary: A simple, yet powerful rule-based proxy
  description: 'Mihomo (formerly Clash.Meta) is a rule-based tunnel written in Go.


    It speaks a wide range of proxy protocols (Shadowsocks, VMess, Trojan, Hysteria,
    WireGuard, ...),

    performs rule-based routing with GEOIP/GEOSITE databases, exposes a RESTful external
    controller,

    and supports transparent proxy, TUN mode and DNS-based traffic splitting.


    The amd64 builds shipped here are the upstream ''compatible'' variants (GOAMD64=v1),
    so they run

    on every x86-64 CPU rather than requiring AVX2.

    '
extra:
  recipe-maintainers:
  - longredzhong
