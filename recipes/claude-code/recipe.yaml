# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 2.1.318
  gcs_base: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases
package:
  name: claude-code
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-x64/claude
    sha256: 708c77b204db30086ff6f1ed34577bda03e1be74ced80557cbf7b54249ebf0bd
- if: linux and aarch64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-arm64/claude
    sha256: 53a0d7e219d7b0804ecba5dbc002745e89f786cc946d2de85a6470d5b2d1fb06
- if: osx and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-x64/claude
    sha256: ee9c8577a528aa8efa478bf552b17efa40bb58aa4981d2913c13d383a4d409a4
- if: osx and arm64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-arm64/claude
    sha256: 677a2ea7bf576cedd20e191d973914ed8a41796f53a63b1923381ddc4d5b5e7d
build:
  skip: win
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
  run: null
tests:
- script:
  - claude --version
about:
  homepage: https://claude.ai/code
  license: LicenseRef-proprietary
  summary: Claude Code - Agentic coding tool by Anthropic
  description: 'Claude Code is an agentic coding tool that lives in your terminal,
    understands your codebase, and helps you code faster through natural language
    commands.

    '
  repository: https://github.com/anthropics/claude-code
  documentation: https://docs.anthropic.com/en/docs/claude-code
extra:
  recipe-maintainers:
  - longredzhong
