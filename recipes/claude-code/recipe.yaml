# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 2.1.317
  gcs_base: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases
package:
  name: claude-code
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-x64/claude
    sha256: eb224419e344575faa4a1f39b290b649425a10cd5ee2ef1d003480cd9ae57eb0
- if: linux and aarch64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-arm64/claude
    sha256: 563a0d60ad0c223d9415768210997acb0f7134ea51dc3c238e88bc2e18ddeefa
- if: osx and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-x64/claude
    sha256: 01c714bc7febdb008f28e3f6facb1dc37e46a4d8fa8db58df2e281ee51cb333c
- if: osx and arm64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-arm64/claude
    sha256: 09f153b46b5df9e8b3454716d682a91901de020cbca630f61dec1a015b32b5e9
build:
  skip: win
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
  run: null
tests:
- script:
  - claude --version
about:
  homepage: https://claude.ai/code
  license: LicenseRef-proprietary
  summary: Claude Code - Agentic coding tool by Anthropic
  description: 'Claude Code is an agentic coding tool that lives in your terminal,
    understands your codebase, and helps you code faster through natural language
    commands.

    '
  repository: https://github.com/anthropics/claude-code
  documentation: https://docs.anthropic.com/en/docs/claude-code
extra:
  recipe-maintainers:
  - longredzhong
