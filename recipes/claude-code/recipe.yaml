# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 2.1.325
  gcs_base: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases
package:
  name: claude-code
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-x64/claude
    sha256: 0dc4f4a9a165fc60746d7ae8489712e5fc352f1e7ad4eb22e7141bd0812eb0cf
- if: linux and aarch64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-arm64/claude
    sha256: 7b6e484b1989a5a14a4b354709ccc8672518a3ec5b9ccd7981fc6254327fde67
- if: osx and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-x64/claude
    sha256: af9760c59f947044e2a0d5072343de563f31efb68bd18ccee4f43c5240570de7
- if: osx and arm64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-arm64/claude
    sha256: 84590fefe6338be9087f5814b61f9a54c5f21524163a4c127cb5a808e31009f2
build:
  skip: win
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
  run: null
tests:
- script:
  - claude --version
about:
  homepage: https://claude.ai/code
  license: LicenseRef-proprietary
  summary: Claude Code - Agentic coding tool by Anthropic
  description: 'Claude Code is an agentic coding tool that lives in your terminal,
    understands your codebase, and helps you code faster through natural language
    commands.

    '
  repository: https://github.com/anthropics/claude-code
  documentation: https://docs.anthropic.com/en/docs/claude-code
extra:
  recipe-maintainers:
  - longredzhong
