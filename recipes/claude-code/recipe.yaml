# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 2.1.314
  gcs_base: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases
package:
  name: claude-code
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-x64/claude
    sha256: 4487042b4c4f5d88d4568f68ae98aae0b1ffae58864cf57fb868641bc5f84594
- if: linux and aarch64
  then:
  - url: ${{ gcs_base }}/${{ version }}/linux-arm64/claude
    sha256: a66c0a8f5d0c87a439953d797985192bbcbaefbce2e0d7b2eaa8df30ef0f3ef2
- if: osx and x86_64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-x64/claude
    sha256: 404779a308a358ecec8b25c8bccf0ce79a94cf261d12cb74065518d189c174f8
- if: osx and arm64
  then:
  - url: ${{ gcs_base }}/${{ version }}/darwin-arm64/claude
    sha256: 21d6e7b9a6f07b4cfcb7df13760b3b72aa25e084e13a5354413382987ba832ed
build:
  skip: win
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
  run: null
tests:
- script:
  - claude --version
about:
  homepage: https://claude.ai/code
  license: LicenseRef-proprietary
  summary: Claude Code - Agentic coding tool by Anthropic
  description: 'Claude Code is an agentic coding tool that lives in your terminal,
    understands your codebase, and helps you code faster through natural language
    commands.

    '
  repository: https://github.com/anthropics/claude-code
  documentation: https://docs.anthropic.com/en/docs/claude-code
extra:
  recipe-maintainers:
  - longredzhong
