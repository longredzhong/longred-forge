# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 0.167.2
package:
  name: codex
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-unknown-linux-musl.tar.gz
    sha256: 8246e846c550ea21197fcc4067bc270dca895e94ea42ed6a282e6f4e0125b15f
- if: linux and aarch64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-unknown-linux-musl.tar.gz
    sha256: ed81fa2c7d209689af061b6f305ed554218de92a1c2c4019142b28f66fa64add
- if: osx and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-apple-darwin.tar.gz
    sha256: 0cf771e76a587059f0ee00c731b0b765b586355e6bd04cde490ebb05963bd68a
- if: osx and arm64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-apple-darwin.tar.gz
    sha256: 7511163b7a0152bcf0e1229092bd2545fdccff64fc8d92ad7c6e01f0ca4681df
- if: win and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-pc-windows-msvc.exe.zip
    sha256: 9f9af73c0761d2a364adaf9de2c69c41f406288f28da5d8077665b2862170704
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
tests:
- script:
  - codex --version
about:
  homepage: https://github.com/openai/codex
  repository: https://github.com/openai/codex
  license: Apache-2.0
  summary: OpenAI Codex CLI
extra:
  recipe-maintainers:
  - longredzhong
  update:
    tag_prefix: rust-v
