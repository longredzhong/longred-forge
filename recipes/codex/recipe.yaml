# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 0.167.0
package:
  name: codex
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-unknown-linux-musl.tar.gz
    sha256: 9d64836106d5b374e90ee4454c7ebcde7ca7106558bd7e41a34b9f26ebda251a
- if: linux and aarch64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-unknown-linux-musl.tar.gz
    sha256: 843489acb4d4b1079745c36b03c5963b887b83155af208fd53584e33ee8eb281
- if: osx and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-apple-darwin.tar.gz
    sha256: d8eb4a865a0b17319cde10347523e5bab0978d01725b39f4a639f40905e01221
- if: osx and arm64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-apple-darwin.tar.gz
    sha256: 4b22a2a971be2791c3e31f912f3e77a88ebd64a65812a7289ccba65dd6425fe9
- if: win and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-pc-windows-msvc.exe.zip
    sha256: 94b51ca84648a6923784ef71f06e2feb1e10796ddb3f5d033ccb0fbe8daa2f16
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
tests:
- script:
  - codex --version
about:
  homepage: https://github.com/openai/codex
  repository: https://github.com/openai/codex
  license: Apache-2.0
  summary: OpenAI Codex CLI
extra:
  recipe-maintainers:
  - longredzhong
  update:
    tag_prefix: rust-v
