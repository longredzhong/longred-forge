# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 0.166.0
package:
  name: codex
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-unknown-linux-musl.tar.gz
    sha256: a0bf572d2f93f056c6712a6da348e96078dc84f3885fd7be67807ef389cb3978
- if: linux and aarch64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-unknown-linux-musl.tar.gz
    sha256: 94eb707605ec2646b2e05b7edf7c4e7b3ccf02b16237c34ae9beb8cfb7f810a9
- if: osx and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-apple-darwin.tar.gz
    sha256: db0c38713c36199b12e7c8d1629386c35a4ce8f99e1c9ce72f1725a74df67b57
- if: osx and arm64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-apple-darwin.tar.gz
    sha256: c48824462fc57681eafb0925d97b11b589010475613904f570b42fea53e240d5
- if: win and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-pc-windows-msvc.exe.zip
    sha256: bf67d9662ed539f305849b74ad6420cc7b23aa2be07753710ca3db9134a0246d
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
tests:
- script:
  - codex --version
about:
  homepage: https://github.com/openai/codex
  repository: https://github.com/openai/codex
  license: Apache-2.0
  summary: OpenAI Codex CLI
extra:
  recipe-maintainers:
  - longredzhong
  update:
    tag_prefix: rust-v
