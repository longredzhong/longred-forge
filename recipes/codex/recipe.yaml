# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 0.170.0
package:
  name: codex
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-unknown-linux-musl.tar.gz
    sha256: d054916ccd28a53820376b8d2f7c875184ca8f40fcd44bbabeb8ee240ce247f5
- if: linux and aarch64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-unknown-linux-musl.tar.gz
    sha256: 0da6b061f6b5223901a5a73e841bd1466596e2ef620d68823360febed2ff7ebc
- if: osx and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-apple-darwin.tar.gz
    sha256: c858bb0149b003a8cf8840a1143c4d953f18bea23ba6ea861d5fdf0b5e29a5a3
- if: osx and arm64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-apple-darwin.tar.gz
    sha256: 7c9f21d5cbae4860d14b379fdcf709ff399ce874fd714b58783e1b4199c2b9a9
- if: win and x86_64
  then:
  - url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-pc-windows-msvc.exe.zip
    sha256: b1634415b6ecb87fea80691580dfe49f83fd46f0ad93f128ba029604d7faa158
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
tests:
- script:
  - codex --version
about:
  homepage: https://github.com/openai/codex
  repository: https://github.com/openai/codex
  license: Apache-2.0
  summary: OpenAI Codex CLI
extra:
  recipe-maintainers:
  - longredzhong
  update:
    tag_prefix: rust-v
