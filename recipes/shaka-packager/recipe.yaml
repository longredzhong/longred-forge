# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 3.9.3
package:
  name: shaka-packager
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/shaka-project/shaka-packager/releases/download/v${{ version
      }}/packager-linux-x64
    sha256: 7a3cf35ad146fd7810b4ededab363c8a3e6121d1b2c8391f53863126186f9ee6
- if: linux and aarch64
  then:
  - url: https://github.com/shaka-project/shaka-packager/releases/download/v${{ version
      }}/packager-linux-arm64
    sha256: d3a50cecc139b54435be1bbbfba5c0ea822d9e1e7edc3531f7821fba65ceebb0
- if: osx and x86_64
  then:
  - url: https://github.com/shaka-project/shaka-packager/releases/download/v${{ version
      }}/packager-osx-x64
    sha256: 64f0fece6a5f80603d9f19b3adc70e626303feb63b459fd599132632b8e76420
- if: osx and arm64
  then:
  - url: https://github.com/shaka-project/shaka-packager/releases/download/v${{ version
      }}/packager-osx-arm64
    sha256: b3049e743451aab5c2cd7b1316a4ce055682c41effe06a49e2e6c95a9243d351
- if: win and x86_64
  then:
  - url: https://github.com/shaka-project/shaka-packager/releases/download/v${{ version
      }}/packager-win-x64.exe
    sha256: ef9cdc9f09cd86321f995c4a6b8dcaf96bcc853707caaf304cb9a0e76f6d68f6
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script:
  - if: win
    then: python "%RECIPE_DIR%/install.py"
    else: python "$RECIPE_DIR/install.py"
requirements:
  build:
  - python
  run: null
tests:
- script:
  - packager --version
about:
  homepage: https://shaka-project.github.io/shaka-packager/html/
  license: BSD-3-Clause
  summary: A media packaging and development framework for VOD and Live DASH and HLS
    applications
  description: 'Shaka Packager is a media packaging SDK for DASH and HLS packaging
    and encryption, supporting Common Encryption for Widevine and other DRM systems.

    It provides both a command-line tool and a C++ library for media packaging operations.

    '
  repository: https://github.com/shaka-project/shaka-packager
  documentation: https://shaka-project.github.io/shaka-packager/html/
extra:
  recipe-maintainers:
  - longredzhong
