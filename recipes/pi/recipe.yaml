# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: 1.0.0
package:
  name: pi
  version: ${{ version }}
source:
- if: linux and x86_64
  then:
  - url: https://github.com/earendil-works/pi/releases/download/v${{ version }}/pi-linux-x64.tar.gz
    sha256: 8fd5543a52a889d60ad57ccbf6c969e73c75c5240aae18ac40b506947a63dc38
- if: linux and aarch64
  then:
  - url: https://github.com/earendil-works/pi/releases/download/v${{ version }}/pi-linux-arm64.tar.gz
    sha256: b60b3fda830a43c1dc3f5edb5fc7b681f22a0a930b48cdac13b97570c6045819
- if: osx and x86_64
  then:
  - url: https://github.com/earendil-works/pi/releases/download/v${{ version }}/pi-darwin-x64.tar.gz
    sha256: 62fb78fcdbc7c0dbd21044dd44bfb3af20df447285bb55e9debf86ff4838776d
- if: osx and arm64
  then:
  - url: https://github.com/earendil-works/pi/releases/download/v${{ version }}/pi-darwin-arm64.tar.gz
    sha256: 97291e7d2eb2d7d95ab1f67d26de7902302201bc8786c132bbbc9e53fa8526cc
- if: win and x86_64
  then:
  - url: https://github.com/earendil-works/pi/releases/download/v${{ version }}/pi-windows-x64.zip
    sha256: f7dbd39814bf6763f01e7f688ad089615de1d0eb55fc8915a49acdc2088f4404
- if: win and aarch64
  then:
  - url: https://github.com/earendil-works/pi/releases/download/v${{ version }}/pi-windows-arm64.zip
    sha256: 122d3a1825eac4aa17081c769188c1d058febf579a9407091ae829626997ea96
build:
  number: 0
  dynamic_linking:
    binary_relocation: false
    rpath_allowlist:
    - '**/*'
  script: 'python -c "import os, shutil, stat, sys; prefix = os.environ.get(''PREFIX'');
    [exit(1) if not prefix else None]; bin_dir = os.path.join(prefix, ''bin'') if
    (sys.platform.startswith(''linux'') or sys.platform == ''darwin'') else os.path.join(prefix,
    ''Scripts''); binary_name = ''pi'' if (sys.platform.startswith(''linux'') or sys.platform
    == ''darwin'') else ''pi.exe''; os.makedirs(bin_dir, exist_ok=True); source_patterns
    = [binary_name, f''./{binary_name}'', os.path.join(''.'', binary_name)]; source_file
    = next((p for p in source_patterns if os.path.isfile(p)), None); [exit(1) if not
    source_file else None]; dest_file = os.path.join(bin_dir, binary_name); shutil.copy2(source_file,
    dest_file); (lambda: os.chmod(dest_file, os.stat(dest_file).st_mode | stat.S_IEXEC
    | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH) if (sys.platform.startswith(''linux'')
    or sys.platform == ''darwin'') else None)()"

    '
requirements:
  build: null
  run: null
tests:
- script:
  - pi --version
about:
  homepage: https://github.com/earendil-works/pi
  license: MIT
  summary: Pi - AI coding agent for your terminal
  description: 'Pi is an open-source AI coding agent that lives in your terminal.
    It helps you write, edit, and debug code through natural language commands, providing
    intelligent code completion, refactoring suggestions, and automated coding assistance
    powered by advanced AI models.

    '
  repository: https://github.com/earendil-works/pi
  documentation: https://github.com/earendil-works/pi
extra:
  recipe-maintainers:
  - longredzhong
