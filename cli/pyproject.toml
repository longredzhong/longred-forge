[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "longred-skills"
version = "0.4.0"
description = "Manage Pixi-packaged agent skills"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
tui = ["questionary>=2.0"]

[project.scripts]
longred-skills = "longred_skills:run"
pixi-longred-skills = "longred_skills:run"
