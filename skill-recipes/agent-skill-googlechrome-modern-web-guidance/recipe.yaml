  sha256: defa0ff7694cf49ff9fd4c0f2bf430dfee04ed673c1426138e38ae8217e1bab8
build:
  number: 0
  noarch: generic
  script: 'mkdir -p "$PREFIX/share/agent-skills/modern-web-guidance"

    cp -R "$SRC_DIR/skills/modern-web-guidance/." "$PREFIX/share/agent-skills/modern-web-guidance/"

    mkdir -p "$PREFIX/share/licenses/agent-skill-googlechrome-modern-web-guidance"

    cp "$SRC_DIR/LICENSE" "$PREFIX/share/licenses/agent-skill-googlechrome-modern-web-guidance/LICENSE"'
tests:
- package_contents:
    files:
    - share/agent-skills/modern-web-guidance/SKILL.md
about:
  summary: Agent skill modern-web-guidance
  license: Apache-2.0
  repository: https://github.com/GoogleChrome/modern-web-guidance
  license_file: LICENSE
