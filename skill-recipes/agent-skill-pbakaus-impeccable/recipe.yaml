package:
  name: agent-skill-pbakaus-impeccable
  version: 0.0.4
source:
  url: https://github.com/pbakaus/impeccable/archive/1995764b4936f2bfbf4eb719cb37b384a45ceacb.tar.gz
  sha256: 8777e66ddc4ef5e3d01e067e7ebcf9d8d86091c430eeaef763a66322269b9f17
build:
  number: 0
  noarch: generic
  script: 'mkdir -p "$PREFIX/share/agent-skills/impeccable"

    cp -R "$SRC_DIR/.agents/skills/impeccable/." "$PREFIX/share/agent-skills/impeccable/"

    mkdir -p "$PREFIX/share/licenses/agent-skill-pbakaus-impeccable"

    cp "$SRC_DIR/LICENSE" "$PREFIX/share/licenses/agent-skill-pbakaus-impeccable/LICENSE"

    cp "$RECIPE_DIR/NOTICE.md" "$PREFIX/share/licenses/agent-skill-pbakaus-impeccable/NOTICE.md"'
tests:
- package_contents:
    files:
    - share/agent-skills/impeccable/SKILL.md
    - share/licenses/agent-skill-pbakaus-impeccable/NOTICE.md
about:
  summary: Agent skill impeccable
  license: Apache-2.0
  repository: https://github.com/pbakaus/impeccable
  license_file: LICENSE
