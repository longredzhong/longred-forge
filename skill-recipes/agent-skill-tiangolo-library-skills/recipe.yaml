  sha256: 71db75a026af8e69513b0a0b3fdaeff0d0324eeeffcbb6c1d0963958c2ee34b2
build:
  number: 0
  noarch: generic
  script: 'mkdir -p "$PREFIX/share/agent-skills/library-skills"

    cp -R "$SRC_DIR/ts/src/tool_skill/." "$PREFIX/share/agent-skills/library-skills/"

