package:
  name: agent-skill-vercel-labs-agent-browser
  version: 0.0.3
source:
  url: https://github.com/vercel-labs/agent-browser/archive/4720bc3dd73f2c8f7c84f415adfa560330b924c4.tar.gz
  sha256: c1862d5c11164a410dd3e1fbb050517b739fb82d6cace729db8fb03a95e007f6
build:
  number: 0
  noarch: generic
  script: 'mkdir -p "$PREFIX/share/agent-skills/agent-browser"

    cp -R "$SRC_DIR/skills/agent-browser/." "$PREFIX/share/agent-skills/agent-browser/"

    mkdir -p "$PREFIX/share/licenses/agent-skill-vercel-labs-agent-browser"

    cp "$SRC_DIR/LICENSE" "$PREFIX/share/licenses/agent-skill-vercel-labs-agent-browser/LICENSE"'
tests:
- package_contents:
    files:
    - share/agent-skills/agent-browser/SKILL.md
about:
  summary: Agent skill agent-browser
  license: Apache-2.0
  repository: https://github.com/vercel-labs/agent-browser
  license_file: LICENSE
